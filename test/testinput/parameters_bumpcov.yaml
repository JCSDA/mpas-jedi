test:
  float relative tolerance: 0.00000001
  integer tolerance: 0
  reference filename: testoutput/parameters_bumpcov.ref
  log output filename: testoutput/parameters_bumpcov.run
  test output filename: testoutput/parameters_bumpcov.run.ref
geometry:
  nml_file: "./Data/480km/namelist.atmosphere_2018041500"
  streams_file: "./Data/480km/streams.atmosphere"
  deallocate non-da fields: true
  bump vunit: "height" # modellevel, height
background:
  state variables: &vars
  - air_temperature
  - water_vapor_mixing_ratio_wrt_moist_air
  - eastward_wind
  - northward_wind
  - air_pressure_at_surface
  filename: "./Data/480km/bg/mpasout.2018-04-15_00.00.00.nc"
  date: &date 2018-04-15T00:00:00Z
background error:
  covariance model: SABER
  ensemble:
    members:
    - filename: Data/480km/bg/ensemble/mem01/EnsForCov.2018-04-15_00.00.00.nc
      date: *date
      state variables: *vars
      stream name: ensemble
    - filename: Data/480km/bg/ensemble/mem02/EnsForCov.2018-04-15_00.00.00.nc
      date: *date
      state variables: *vars
      stream name: ensemble
    - filename: Data/480km/bg/ensemble/mem03/EnsForCov.2018-04-15_00.00.00.nc
      date: *date
      state variables: *vars
      stream name: ensemble
    - filename: Data/480km/bg/ensemble/mem04/EnsForCov.2018-04-15_00.00.00.nc
      date: *date
      state variables: *vars
      stream name: ensemble
    - filename: Data/480km/bg/ensemble/mem05/EnsForCov.2018-04-15_00.00.00.nc
      date: *date
      state variables: *vars
      stream name: ensemble
  saber central block:
    saber block name: BUMP_NICAS
    calibration:
      io:
        files prefix: Data/bump/mpas_bumpcov
      drivers:
        compute covariance: true
        compute correlation: true
        multivariate strategy: univariate
        compute variance: true
        compute moments: true
        compute nicas: true
        write local nicas: true
        write global nicas: true
        write nicas grids: true
      sampling:
        computation grid size: 1024
        diagnostic grid size: 200
        distance classes: 5
        distance class width: 1500.0e3
        reduced levels: 1
        local diagnostic: true
        averaging length-scale: 5000.0e3
      diagnostics:
        target ensemble size: 5
      variance:
        objective filtering: true
        filtering iterations: 1
        initial length-scale:
        - variables:
          - air_temperature
          - water_vapor_mixing_ratio_wrt_moist_air
          - eastward_wind
          - northward_wind
          - air_pressure_at_surface
          value: 5000.0e3
      fit:
        horizontal filtering length-scale: 5000.0e3
      nicas:
        resolution: 4
      grids:
      - model:
          variables:
          - air_temperature
          - water_vapor_mixing_ratio_wrt_moist_air
          - eastward_wind
          - northward_wind
      - model:
          variables:
          - air_pressure_at_surface
      output model files:
      - parameter: stddev
        file:
          filename: Data/bump/mpas.stddev.$Y-$M-$D_$h.$m.$s.nc
          date: *date
          stream name: control
      - parameter: cor_rh
        file:
          filename: Data/bump/mpas.cor_rh.$Y-$M-$D_$h.$m.$s.nc
          date: *date
          stream name: control
      - parameter: cor_rv
        file:
          filename: Data/bump/mpas.cor_rv.$Y-$M-$D_$h.$m.$s.nc
          date: *date
          stream name: control
