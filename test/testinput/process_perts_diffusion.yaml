test:
  float relative tolerance: 0.00000001
  integer tolerance: 0
  reference filename: testoutput/process_perts_diffusion.ref
  log output filename: testoutput/process_perts_diffusion.run
  test output filename: testoutput/process_perts_diffusion.run.ref
geometry:
  nml_file: "./Data/480km/namelist.atmosphere_2018041500"
  streams_file: "./Data/480km/streams.atmosphere"
background:
  state variables: &vars
  - air_temperature
  - eastward_wind
  - northward_wind
  - water_vapor_mixing_ratio_wrt_moist_air
  - air_pressure_at_surface
  filename: "./Data/480km/bg/mpasout.2018-04-15_00.00.00.nc"
  date: &date "2018-04-15T00:00:00Z"
input variables: *vars
ensemble:
  members:
  - filename: Data/480km/bg/ensemble/mem01/EnsForCov.2018-04-15_00.00.00.nc
    date: *date
    state variables: *vars
  - filename: Data/480km/bg/ensemble/mem02/EnsForCov.2018-04-15_00.00.00.nc
    date: *date
    state variables: *vars
  - filename: Data/480km/bg/ensemble/mem03/EnsForCov.2018-04-15_00.00.00.nc
    date: *date
    state variables: *vars
  - filename: Data/480km/bg/ensemble/mem04/EnsForCov.2018-04-15_00.00.00.nc
    date: *date
    state variables: *vars
  - filename: Data/480km/bg/ensemble/mem05/EnsForCov.2018-04-15_00.00.00.nc
    date: *date
    state variables: *vars
# BAND ORDER MATTERS: blocks by default act as low-pass filters, so when operating recursively,
# the RESIDUALS passed to the next filter will have the high-pass component of the ensemble
# member/perturbation.
recursive perturbations processing: true
bands:
- band: # band 1 - long scale
    filter:  # don't need interpolation to gaussian grid like the spectral case
    - saber block name: diffusion filter
      read:
        groups:
        - variables:
          - eastward_wind
          - northward_wind
          - air_temperature
          - water_vapor_mixing_ratio_wrt_moist_air
          - air_pressure_at_surface
          horizontal:
            filepath: Data/diffusion/diffusion_hz_5000km
  output:
    model write:
      stream name: control
      filename: Data/diffusion/wb1_pert_mb%MEM%
      member pattern: '%MEM%'
- band: # band 2 - middle scale
    filter:
      - saber block name: diffusion filter
        read:
          groups:
          - variables:
            - eastward_wind
            - northward_wind
            - air_temperature
            - water_vapor_mixing_ratio_wrt_moist_air
            - air_pressure_at_surface
            horizontal:
              filepath: Data/diffusion/diffusion_hz_2500km
  output:
    model write:
      stream name: control
      filename: Data/diffusion/wb2_pert_mb%MEM%
      member pattern: '%MEM%'
- output: # write out residual (short scales)
    model write:
      stream name: control
      filename: Data/diffusion/wb3_residual_pert_mb%MEM%
      member pattern: '%MEM%'
